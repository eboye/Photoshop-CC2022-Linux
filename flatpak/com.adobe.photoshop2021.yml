app-id: com.adobe.photoshop2021
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: launch-photoshop.sh

finish-args:
  - --allow=devel
  - --allow=multiarch
  - --share=network
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=all
  - --persist=Adobe-Photoshop
  - --env=LD_LIBRARY_PATH=/app/lib:/app/lib/i386-linux-gnu
  - --env=PATH=/app/bin:/app/wine-9.0/bin:/usr/bin
  - --env=WINEPREFIX=/var/data/Adobe-Photoshop
  - --require-version=1.1.2

add-extensions:
  org.freedesktop.Platform.Compat.i386:
    directory: lib/i386-linux-gnu
    version: "49"

cleanup:
  - /include
  - /lib/pkgconfig
  - /man
  - /share/doc
  - /share/man
  - '*.la'
  - '*.a'

modules:
  # Custom Wine 9.0 build (your existing wine-9.0)
  - name: wine-custom
    buildsystem: simple
    build-commands:
      - mkdir -p /app/wine-9.0
      - cp -a * /app/wine-9.0/
    sources:
      - type: archive
        url: https://github.com/Kron4ek/Wine-Builds/releases/download/9.0/wine-9.0-amd64.tar.xz
        sha256: cf0c09d4346dc10bc92ab674936292cff47eeb71ca7604b8e6303b7bdb97e2f6
        dest-filename: wine-9.0.tar.xz

  # Winetricks
  - name: winetricks
    buildsystem: simple
    build-commands:
      - install -Dm755 winetricks /app/bin/winetricks
    sources:
      - type: file
        url: file:///home/eboye/GitHub/LinuxPS/scripts/winetricks
        sha256: 7f29a4ec7c559af18e88f1c0d012c2b0873c5228158511c3b5f4c9b127b9a733

  # Adobe Photoshop 2021 Application
  - name: adobe-photoshop2021
    buildsystem: simple
    build-commands:
      - mkdir -p "/app/Adobe-Photoshop/drive_c/Program Files/Adobe"
      - cp -a * "/app/Adobe-Photoshop/drive_c/Program Files/Adobe/" 2>/dev/null || true
    sources:
      - type: archive
        url: file:///home/eboye/GitHub/LinuxPS/AdobePhotoshop2021.tar.xz
        sha256: 8321b969161f2d2ad736067320d493c5b6ae579eaab9400cd1fda6871af2c033

  # Launcher Script
  - name: launcher
    buildsystem: simple
    build-commands:
      - install -Dm755 launch-photoshop.sh /app/bin/launch-photoshop.sh
    sources:
      - type: file
        url: file:///home/eboye/GitHub/LinuxPS/scripts/launch-photoshop.sh
        sha256: 6537923e198d05e46061ca4796ef27f61c261064b425811889627ad160295d89

  # Desktop Entry
  - name: desktop-entry
    buildsystem: simple
    build-commands:
      - install -Dm644 com.adobe.photoshop2021.desktop /app/share/applications/com.adobe.photoshop2021.desktop
    sources:
      - type: file
        url: file:///home/eboye/GitHub/LinuxPS/flatpak/com.adobe.photoshop2021.desktop
        sha256: eb0431af8a6d3c795757ffdafbc2ad40fa7104560c28b0621fdd751cd488368a
